    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://av0.dev/" />
    <link rel="icon" href="./portfolio-mark.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />

    <script>
      (() => {
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          const savedTheme =
            window.localStorage.getItem("av0-portfolio-theme") ??
            window.localStorage.getItem("wade-portfolio-theme");
          document.documentElement.dataset.theme =
            savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme;
        } catch {
          document.documentElement.dataset.theme = systemTheme;
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "av0",
        "url": "https://av0.dev/",
        "sameAs": ["https://github.com/reallav0"],
        "jobTitle": "Software Developer",
        "knowsLanguage": ["English", "Vietnamese"]
      }
    </script>
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
